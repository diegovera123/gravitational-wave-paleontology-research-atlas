
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Gravitational-Wave Paleontology Research Atlas</title>
</head>

<body>

  <h1>Gravitational-Wave Research Atlas</h1>

  <p>
    An interconnected curriculum for gravitational-wave research.
  </p>

  <h2>Knowledge Graph</h2>

  <div id="graph"></div>
  <div id="details"></div>

<script>
  fetch("knowledge-graph/concepts.json")
    .then(response => response.json())
    .then(data => {
      const graph = document.getElementById("graph");

 
data.concepts.forEach(concept => {
  const item = document.createElement("button");

  item.textContent = concept.title;


item.addEventListener("click", () => {
  const details = document.getElementById("details");

  const prerequisites = concept.prerequisites.map(id => {
    const prerequisite = data.concepts.find(c => c.id === id);

    return prerequisite.title;
  });

  details.innerHTML = "";

  const title = document.createElement("h3");
  title.textContent = concept.title;

  const prerequisiteText = document.createElement("p");
  prerequisiteText.textContent =
    "Prerequisites: " + (prerequisites.join(", ") || "None");

  const objectives = document.createElement("p");
  objectives.textContent = concept.learningObjectives.join(" • ");

  details.appendChild(title);
  details.appendChild(prerequisiteText);
  details.appendChild(objectives);
});

  graph.appendChild(item);
});
    });
  
</script>


</body>

</html>
